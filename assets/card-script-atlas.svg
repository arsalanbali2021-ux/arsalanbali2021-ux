<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Script Atlas: featured project</title>
  <desc id="desc">An interactive epigraphy lab and atlas for the historical writing systems of South Asia. 28 scripts mapped, 28 inscriptions catalogued, 4 decipherment cases, 121 automated tests, zero dependencies. Built with vanilla JavaScript, Canvas 2D, HTML5 and CSS3, offline-first.</desc>
  <style>
    .bg{fill:#FFFAF1}.edge{fill:none;stroke:#EBD9C3;stroke-width:2}
    .ink{fill:#2B1A10}.soft{fill:#6E5442}.accent{fill:#A94416}.saff{fill:#E87522}
    .panel{fill:#FFFFFF;fill-opacity:.6;stroke:#EBD9C3;stroke-width:1.5}
    .chip{fill:#FFFFFF;stroke:#EBD9C3;stroke-width:1.5}
    .lock{fill:#A94416;fill-opacity:.1;stroke:#A94416;stroke-opacity:.35;stroke-width:1.2}
    .serif{font-family:Georgia,'Times New Roman',Times,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .caps{font-size:13px;font-weight:600;letter-spacing:2.6px}
    .branch{fill:none;stroke:#E87522;stroke-opacity:.6;stroke-width:1.6;stroke-dasharray:140;animation:grow 1.2s ease-out both}
    .node{fill:#E87522;animation:pop .5s ease-out both}
    .root{fill:#A94416}
    .lab{font-size:13px}
    .l1{animation-delay:.2s}.l2{animation-delay:.7s}.l3{animation-delay:1.2s}
    @keyframes grow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    @media (prefers-color-scheme:dark){
      .bg{fill:#17110C}.edge{stroke:#3A2B1F}
      .ink{fill:#F7EBDD}.soft{fill:#C9B29C}.accent{fill:#F08A3E}.root{fill:#F08A3E}
      .panel{fill:#211811;fill-opacity:1;stroke:#3A2B1F}.chip{fill:#211811;stroke:#3A2B1F}
      .lock{fill:#F08A3E;fill-opacity:.12;stroke:#F08A3E}
    }
    @media (prefers-reduced-motion:reduce){.branch,.node{animation:none}}
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="398" rx="18"/>
  <rect class="edge" x="1" y="1" width="1198" height="398" rx="18"/>

  <!-- left column -->
  <text class="sans caps accent" x="56" y="70">FEATURED · 01  ·  IKS DIGITAL EPIGRAPHY</text>
  <text class="serif ink" x="54" y="126" font-size="50" font-weight="700">Script Atlas</text>
  <g class="sans soft" font-size="19">
    <text x="56" y="168">An interactive epigraphy lab and atlas for the historical</text>
    <text x="56" y="194">writing systems and stone inscriptions of South Asia.</text>
  </g>

  <g class="serif saff" font-size="40" font-weight="700">
    <text x="56" y="262">28</text>
    <text x="190" y="262">28</text>
    <text x="324" y="262">4</text>
    <text x="458" y="262">121</text>
    <text x="592" y="262">0</text>
  </g>
  <g class="sans soft" font-size="13">
    <text x="56" y="286">scripts mapped</text>
    <text x="190" y="286">inscriptions</text>
    <text x="324" y="286">decipherment cases</text>
    <text x="458" y="286">automated tests</text>
    <text x="592" y="286">dependencies</text>
  </g>

  <g class="sans ink" font-size="13" font-weight="600">
    <rect class="chip" x="56" y="322" width="104" height="32" rx="16"/>
    <text x="108" y="343" text-anchor="middle">Vanilla JS</text>
    <rect class="chip" x="168" y="322" width="104" height="32" rx="16"/>
    <text x="220" y="343" text-anchor="middle">Canvas 2D</text>
    <rect class="chip" x="280" y="322" width="120" height="32" rx="16"/>
    <text x="340" y="343" text-anchor="middle">HTML5 · CSS3</text>
    <rect class="chip" x="408" y="322" width="112" height="32" rx="16"/>
    <text x="464" y="343" text-anchor="middle">Offline-first</text>
  </g>
  <rect class="lock" x="536" y="322" width="186" height="32" rx="16"/>
  <text class="sans accent" x="629" y="342" font-size="11" font-weight="700" letter-spacing="1.6" text-anchor="middle">PRIVATE · DEMO ON ASK</text>

  <!-- right: family tree excerpt -->
  <rect class="panel" x="752" y="36" width="412" height="336" rx="14"/>
  <text class="sans accent" x="776" y="64" font-size="11" font-weight="600" letter-spacing="2.4">BRAHMIC FAMILY · EXCERPT</text>

  <g>
    <!-- root to level 2 -->
    <path class="branch l1" d="M958 116 C958 136 842 136 842 156"/>
    <path class="branch l1" d="M958 116 C958 136 958 136 958 156"/>
    <path class="branch l1" d="M958 116 C958 136 1076 136 1076 156"/>
    <!-- level 2 to level 3 -->
    <path class="branch l2" d="M842 196 C842 214 798 214 798 232"/>
    <path class="branch l2" d="M842 196 C842 214 884 214 884 232"/>
    <path class="branch l2" d="M958 196 C958 214 976 214 976 232"/>
    <path class="branch l2" d="M1076 196 C1076 214 1084 214 1084 232"/>
    <!-- level 3 to level 4 -->
    <path class="branch l3" d="M798 272 C798 288 798 288 798 304"/>
    <path class="branch l3" d="M884 272 C884 288 884 288 884 304"/>
    <path class="branch l3" d="M1084 272 C1084 288 1084 288 1084 304"/>
  </g>

  <g class="sans ink lab">
    <circle class="node root" cx="958" cy="88" r="6"/>
    <text x="958" y="110" text-anchor="middle" font-weight="700">Brāhmī</text>

    <circle class="node l1" cx="842" cy="164" r="5"/>
    <text x="842" y="186" text-anchor="middle">Gupta</text>
    <circle class="node l1" cx="958" cy="164" r="5"/>
    <text x="958" y="186" text-anchor="middle">Kadamba</text>
    <circle class="node l1" cx="1076" cy="164" r="5"/>
    <text x="1076" y="186" text-anchor="middle">Tamil-Brāhmī</text>

    <circle class="node l2" cx="798" cy="240" r="5"/>
    <text x="798" y="262" text-anchor="middle">Nāgarī</text>
    <circle class="node l2" cx="884" cy="240" r="5"/>
    <text x="884" y="262" text-anchor="middle">Śāradā</text>
    <circle class="node l2" cx="976" cy="240" r="5"/>
    <text x="976" y="262" text-anchor="middle">Kannada–Telugu</text>
    <circle class="node l2" cx="1084" cy="240" r="5"/>
    <text x="1084" y="262" text-anchor="middle">Grantha</text>

    <circle class="node l3" cx="798" cy="312" r="5"/>
    <text x="798" y="334" text-anchor="middle">Devanāgarī</text>
    <circle class="node l3" cx="884" cy="312" r="5"/>
    <text x="884" y="334" text-anchor="middle">Gurmukhī</text>
    <circle class="node l3" cx="1084" cy="312" r="5"/>
    <text x="1084" y="334" text-anchor="middle">Malayāḷam</text>
  </g>
  <text class="sans soft" x="1144" y="360" font-size="11" text-anchor="end">one of 28 scripts in the atlas</text>
</svg>
