<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Now learning: machine learning</title>
  <desc id="desc">Working from Python and data handling toward models I can explain, test and ship. Route: Python and data, classic ML, deep learning, applied AI.</desc>
  <style>
    .bg{fill:#FFFAF1}.edge{fill:none;stroke:#EBD9C3;stroke-width:2}
    .ink{fill:#2B1A10}.soft{fill:#6E5442}.accent{fill:#A94416}.saff{fill:#E87522}
    .pt{fill:#A94416;fill-opacity:.55}
    .fit{fill:none;stroke:#E87522;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:130;animation:draw 1.6s .3s ease-out both}
    .axis{stroke:#EBD9C3;stroke-width:1.5}
    .track{stroke:#E87522;stroke-width:4;stroke-linecap:round}
    .stop{fill:#FFFAF1;stroke:#E87522;stroke-width:3}
    .serif{font-family:Georgia,'Times New Roman',Times,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .caps{font-size:12px;font-weight:600;letter-spacing:2.4px}
    @keyframes draw{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
    @media (prefers-color-scheme:dark){
      .bg{fill:#17110C}.edge{stroke:#3A2B1F}.axis{stroke:#3A2B1F}
      .ink{fill:#F7EBDD}.soft{fill:#C9B29C}.accent{fill:#F08A3E}
      .pt{fill:#F08A3E;fill-opacity:.5}.stop{fill:#17110C}
    }
    @media (prefers-reduced-motion:reduce){.fit{animation:none}}
  </style>

  <rect class="bg" x="1" y="1" width="588" height="358" rx="18"/>
  <rect class="edge" x="1" y="1" width="588" height="358" rx="18"/>

  <text class="sans caps accent" x="40" y="56">03 · NOW LEARNING</text>
  <text class="serif ink" x="38" y="104" font-size="38" font-weight="700">Machine learning</text>
  <g class="sans soft" font-size="15">
    <text x="40" y="138">From Python and data handling toward</text>
    <text x="40" y="160">models I can explain, test and ship.</text>
  </g>

  <!-- regression motif -->
  <g>
    <line class="axis" x1="438" y1="44" x2="438" y2="130"/>
    <line class="axis" x1="438" y1="130" x2="552" y2="130"/>
    <circle class="pt" cx="450" cy="116" r="3.5"/>
    <circle class="pt" cx="461" cy="104" r="3.5"/>
    <circle class="pt" cx="470" cy="111" r="3.5"/>
    <circle class="pt" cx="480" cy="94" r="3.5"/>
    <circle class="pt" cx="491" cy="98" r="3.5"/>
    <circle class="pt" cx="500" cy="82" r="3.5"/>
    <circle class="pt" cx="511" cy="86" r="3.5"/>
    <circle class="pt" cx="521" cy="70" r="3.5"/>
    <circle class="pt" cx="530" cy="74" r="3.5"/>
    <circle class="pt" cx="541" cy="58" r="3.5"/>
    <path class="fit" d="M444 120 L548 58"/>
    <text class="sans soft" x="495" y="148" font-size="10" letter-spacing="1.4" text-anchor="middle">FIT · TEST · EXPLAIN</text>
  </g>

  <!-- route -->
  <line class="track" x1="76" y1="232" x2="514" y2="232"/>
  <circle class="stop" cx="76" cy="232" r="9"/>
  <circle class="stop" cx="222" cy="232" r="9"/>
  <circle class="stop" cx="368" cy="232" r="9"/>
  <circle class="stop" cx="514" cy="232" r="9"/>
  <circle class="saff" cx="76" cy="232" r="5">
    <animate attributeName="cx" values="76;514;514" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g class="sans" text-anchor="middle">
    <text class="ink" x="76" y="266" font-size="14" font-weight="600">Python &amp; data</text>
    <text class="soft" x="76" y="286" font-size="12">the foundation</text>
    <text class="ink" x="222" y="266" font-size="14" font-weight="600">Classic ML</text>
    <text class="soft" x="222" y="286" font-size="12">regression to trees</text>
    <text class="ink" x="368" y="266" font-size="14" font-weight="600">Deep learning</text>
    <text class="soft" x="368" y="286" font-size="12">neural networks</text>
    <text class="ink" x="514" y="266" font-size="14" font-weight="600">Applied AI</text>
    <text class="soft" x="514" y="286" font-size="12">LLM-powered tools</text>
  </g>

  <text class="sans soft" x="40" y="326" font-size="13" font-style="italic">Progress over polish. Experiments land here when they are ready.</text>
</svg>
