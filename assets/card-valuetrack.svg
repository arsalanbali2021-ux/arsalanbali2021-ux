<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-labelledby="title desc">
  <title id="title">ValueTrack: full-stack project</title>
  <desc id="desc">Loans, EMIs, expenses and insurance in one dashboard. EMI schedules with Decimal precision, CSV and XLSX import with pandas, rule-based insurance ranking. Built with Flask, SQLAlchemy, MySQL and pytest.</desc>
  <style>
    .bg{fill:#FFFAF1}.edge{fill:none;stroke:#EBD9C3;stroke-width:2}
    .ink{fill:#2B1A10}.soft{fill:#6E5442}.accent{fill:#A94416}.saff{fill:#E87522}
    .int{fill:#A94416;fill-opacity:.35}.pri{fill:#E87522}
    .chip{fill:#FFFFFF;stroke:#EBD9C3;stroke-width:1.5}
    .axis{stroke:#EBD9C3;stroke-width:1.5}
    .serif{font-family:Georgia,'Times New Roman',Times,serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .caps{font-size:12px;font-weight:600;letter-spacing:2.4px}
    .bar{animation:in .6s ease-out both}
    @keyframes in{from{opacity:0}to{opacity:1}}
    @media (prefers-color-scheme:dark){
      .bg{fill:#17110C}.edge{stroke:#3A2B1F}.axis{stroke:#3A2B1F}
      .ink{fill:#F7EBDD}.soft{fill:#C9B29C}.accent{fill:#F08A3E}
      .int{fill:#F08A3E;fill-opacity:.3}
      .chip{fill:#211811;stroke:#3A2B1F}
    }
    @media (prefers-reduced-motion:reduce){.bar{animation:none}}
  </style>

  <rect class="bg" x="1" y="1" width="588" height="358" rx="18"/>
  <rect class="edge" x="1" y="1" width="588" height="358" rx="18"/>

  <text class="sans caps accent" x="40" y="56">02 · FULL-STACK · PUBLIC</text>
  <text class="serif ink" x="38" y="104" font-size="38" font-weight="700">ValueTrack</text>
  <g class="sans soft" font-size="15">
    <text x="40" y="138">Loans, EMIs, expenses and insurance</text>
    <text x="40" y="160">in one dashboard. My 2nd-year B.Tech project.</text>
  </g>

  <!-- amortisation motif: interest shrinks, principal grows -->
  <g>
    <rect class="int bar" x="436" y="44" width="9" height="56" rx="2" style="animation-delay:.05s"/>
    <rect class="pri bar" x="436" y="100" width="9" height="24" rx="2" style="animation-delay:.05s"/>
    <rect class="int bar" x="449" y="44" width="9" height="51" rx="2" style="animation-delay:.1s"/>
    <rect class="pri bar" x="449" y="95" width="9" height="29" rx="2" style="animation-delay:.1s"/>
    <rect class="int bar" x="462" y="44" width="9" height="46" rx="2" style="animation-delay:.15s"/>
    <rect class="pri bar" x="462" y="90" width="9" height="34" rx="2" style="animation-delay:.15s"/>
    <rect class="int bar" x="475" y="44" width="9" height="40" rx="2" style="animation-delay:.2s"/>
    <rect class="pri bar" x="475" y="84" width="9" height="40" rx="2" style="animation-delay:.2s"/>
    <rect class="int bar" x="488" y="44" width="9" height="34" rx="2" style="animation-delay:.25s"/>
    <rect class="pri bar" x="488" y="78" width="9" height="46" rx="2" style="animation-delay:.25s"/>
    <rect class="int bar" x="501" y="44" width="9" height="28" rx="2" style="animation-delay:.3s"/>
    <rect class="pri bar" x="501" y="72" width="9" height="52" rx="2" style="animation-delay:.3s"/>
    <rect class="int bar" x="514" y="44" width="9" height="21" rx="2" style="animation-delay:.35s"/>
    <rect class="pri bar" x="514" y="65" width="9" height="59" rx="2" style="animation-delay:.35s"/>
    <rect class="int bar" x="527" y="44" width="9" height="14" rx="2" style="animation-delay:.4s"/>
    <rect class="pri bar" x="527" y="58" width="9" height="66" rx="2" style="animation-delay:.4s"/>
    <rect class="int bar" x="540" y="44" width="9" height="7" rx="2" style="animation-delay:.45s"/>
    <rect class="pri bar" x="540" y="51" width="9" height="73" rx="2" style="animation-delay:.45s"/>
    <line class="axis" x1="432" y1="130" x2="553" y2="130"/>
    <text class="sans soft" x="492" y="148" font-size="10" letter-spacing="1.2" text-anchor="middle">INTEREST vs PRINCIPAL</text>
  </g>

  <g class="sans ink" font-size="15">
    <path class="saff" d="M44 204 l5 -5 l5 5 l-5 5 z"/>
    <text x="64" y="209">EMI schedules with Decimal precision</text>
    <path class="saff" d="M44 234 l5 -5 l5 5 l-5 5 z"/>
    <text x="64" y="239">CSV and XLSX import with pandas</text>
    <path class="saff" d="M44 264 l5 -5 l5 5 l-5 5 z"/>
    <text x="64" y="269">Rule-based insurance ranking, top 5 plans</text>
  </g>

  <g class="sans ink" font-size="13" font-weight="600">
    <rect class="chip" x="40" y="298" width="66" height="30" rx="15"/>
    <text x="73" y="318" text-anchor="middle">Flask</text>
    <rect class="chip" x="114" y="298" width="104" height="30" rx="15"/>
    <text x="166" y="318" text-anchor="middle">SQLAlchemy</text>
    <rect class="chip" x="226" y="298" width="72" height="30" rx="15"/>
    <text x="262" y="318" text-anchor="middle">MySQL</text>
    <rect class="chip" x="306" y="298" width="68" height="30" rx="15"/>
    <text x="340" y="318" text-anchor="middle">pytest</text>
  </g>
  <text class="sans accent" x="550" y="318" font-size="14" font-weight="700" text-anchor="end">View repo →</text>
</svg>
